services:
  - type: web
    name: sillytavern
    runtime: node
    buildCommand: npm ci --production=false
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: LISTEN
        value: "true"
      - key: PORT
        value: "10000"
      - key: WHITELIST
        value: "false"
      # 强制禁用白名单模式
      - key: WHITELISTMODE
        value: "false"
      - key: AVOID_LOCAL_MODELS
        value: "true"
      - key: DISABLE_EXTENSIONS
        value: "false"
      - key: AUTO_UPDATE
        value: "false"
      # 基础认证（强烈推荐启用）
      - key: BASIC_AUTH
        value: "true"
      - key: BASIC_AUTH_USER
        generateValue: true
      - key: BASIC_AUTH_PASSWORD
        generateValue: true