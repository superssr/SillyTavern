# Nginx配置文件 - 用于Authelia反向代理

upstream authelia {
    server auth.chatmask.io:9091;
}

upstream sillytavern {
    server sillytavern-vmpi.onrender.com:443;
}

server {
    listen 80;
    server_name st.chatmask.io;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name st.chatmask.io;

    # SSL证书配置
    ssl_certificate /etc/letsencrypt/live/chatmask.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chatmask.io/privkey.pem;

    # Authelia认证位置
    location /authelia {
        internal;
        proxy_pass http://authelia/api/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        
        # 传递原始请求信息
        proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Uri $request_uri;
    }

    # SillyTavern主应用
    location / {
        # Authelia认证
        auth_request /authelia;
        auth_request_set $target_url $scheme://$http_host$request_uri;
        auth_request_set $user $upstream_http_remote_user;
        auth_request_set $groups $upstream_http_remote_groups;
        auth_request_set $name $upstream_http_remote_name;
        auth_request_set $email $upstream_http_remote_email;
        
        # 错误处理
        error_page 401 =302 https://auth.chatmask.io/?rd=$target_url;
        error_page 403 = /forbidden.html;
        
        # 传递用户信息到SillyTavern (用于SSO)
        proxy_set_header Remote-User $user;
        proxy_set_header Remote-Groups $groups;
        proxy_set_header Remote-Name $name;
        proxy_set_header Remote-Email $email;
        
        # 代理到SillyTavern
        proxy_pass https://sillytavern;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket支持
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache_bypass $http_upgrade;
    }
}